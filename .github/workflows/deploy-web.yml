name: Deploy OMS Web

on:
  push:
    branches:
      - main
    paths:
      - "src/order-management-web/**"
      - ".github/workflows/deploy-web.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

  AWS_ROLE_ARN: arn:aws:iam::697589240899:role/oms-dev-github-actions

  WEB_BUCKET: oms-dev-web-697589240899
  CLOUDFRONT_DISTRIBUTION_ID: E2WYTMWO9WH3X2

  VITE_ENTRA_CLIENT_ID: f2d75a67-e957-467c-807a-7c6cbf8d19d0
  VITE_ENTRA_TENANT_ID: 7a971eb6-18c3-4d21-a9d4-cde169b35a09
  VITE_OMS_API_CLIENT_ID: 13a4204d-792f-4ec3-9c1a-80a507104a9b
  VITE_API_BASE_URL: https://api.digizerones.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/order-management-web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/order-management-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ env.WEB_BUCKET }}/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
