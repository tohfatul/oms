services:

  postgres:
    image: postgres:17
    container_name: oms-postgres

    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  localstack:
    image: localstack/localstack
    container_name: oms-localstack

    ports:
      - "4566:4566"

    environment:
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SQS_ENDPOINT_STRATEGY: path
      LOCALSTACK_HOST: localstack:4566

    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:4566/_localstack/health"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  oms-api:
    image: oms-api:local
    container_name: oms-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__OrderDatabase: "Host=postgres;Port=5432;Database=orderdb;Username=postgres;Password=postgres"

      AWS__SNS__Region: us-east-1
      AWS__SNS__ServiceUrl: http://localstack:4566
      AWS__SNS__TopicArn: arn:aws:sns:us-east-1:000000000000:order-created

    depends_on:
      postgres:
        condition: service_healthy

      localstack:
        condition: service_healthy


  oms-erp-worker:
    image: oms-erp-worker:local
    container_name: oms-erp-worker

    environment:
      DOTNET_ENVIRONMENT: Development

      AWS__SQS__Region: us-east-1
      AWS__SQS__ServiceUrl: http://localstack:4566

      AWS__SQS__QueueUrl: http://localstack:4566/queue/us-east-1/000000000000/order-erp-queue

    depends_on:
      localstack:
        condition: service_healthy


  oms-notification-worker:
    image: oms-notification-worker:local
    container_name: oms-notification-worker

    environment:
      DOTNET_ENVIRONMENT: Development

      AWS__SQS__Region: us-east-1
      AWS__SQS__ServiceUrl: http://localstack:4566

      AWS__SQS__QueueUrl: http://localstack:4566/queue/us-east-1/000000000000/order-notification-queue

    depends_on:
      localstack:
        condition: service_healthy


volumes:
  postgres-data:
  localstack-data: